.b{font:inherit;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--bd);border-radius:12px;min-height:46px;padding:8px 14px;cursor:pointer}
.b.p{background:var(--ink);color:var(--pa);border-color:var(--ink)}.b.r{background:var(--sos);color:#fff;border-color:var(--sos)}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--bd);border-radius:12px;min-height:46px;padding:8px 12px;width:100%}
.loc{background:var(--gz);border-radius:10px;padding:6px 10px;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.g2 .b{display:flex;flex-direction:column;align-items:center;padding:16px 6px;text-align:center}
.sos{position:absolute;right:14px;bottom:14px;width:66px;height:66px;border-radius:50%;font-size:17px;box-shadow:0 3px 8px #0006}
.msg{border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:8px 12px;margin:8px 0;max-width:92%}.msg.me{background:var(--ink);color:var(--pa);margin-left:auto}
.chip{display:inline-block;border:1px solid var(--bd);border-radius:99px;padding:1px 9px;font-size:12px;margin-right:4px}.chip.s{background:var(--sos);color:#fff;border-color:var(--sos)}
.modal{position:absolute;inset:0;background:#0008;display:flex;align-items:flex-end;padding:12px}.modal>div{background:var(--card);border-radius:18px;padding:16px;width:100%}
.pan{max-width:1150px;margin:0 auto;padding:10px 14px 40px}
.kb{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:12px;overflow-x:auto}.col{background:var(--gz);border-radius:14px;padding:8px}
.tk{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0}.tk.s{border:2px solid var(--sos)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kp div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.kp b{font:700 28px "Bricolage Grotesque",sans-serif;display:block}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:12px}.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
svg text{fill:var(--ink);font-size:5.5px}

function rota(a,b,acc){const adj={};P.E.forEach(([x,y,ok])=>{if(acc&&!ok||!L[x]||!L[y])return;const w=Math.hypot(L[x].x-L[y].x,L[x].y-L[y].y)+(L[x].nv!==L[y].nv?30:0);(adj[x]=adj[x]||[]).push([y,w]);(adj[y]=adj[y]||[]).push([x,w])});
 const d={[a]:0},pr={},o=new Set(Object.keys(L));while(o.size){let u=null;o.forEach(k=>{if(d[k]!==undefined&&(u===null||d[k]<d[u]))u=k});if(u===null||u===b)break;o.delete(u);(adj[u]||[]).forEach(([v,w])=>{if(o.has(v)&&d[u]+w<(d[v]??1e9)){d[v]=d[u]+w;pr[v]=u}})}
 if(d[b]===undefined)return null;const p=[b];while(p[0]!==a)p.unshift(pr[p[0]]);return p}
const SHOW=['acesso','ancora','evento','alimentacao','elevador','estacionamento'];
function plan(path,aqui,heat){let s='<svg viewBox="0 0 320 220" width="100%" role="img" aria-label="Planta do Capim Dourado Shopping" style="background:var(--card);border:1px solid var(--bd);border-radius:12px">';

 const mx=heat?Math.max(...Object.values(heat)):1,fim=path&&path[path.length-1];

  if(on||h||SHOW.includes(l.t)&&!path&&!heat)s+=`<text x="${l.x+4}" y="${l.y-4}">${l.n.replace(/ \(.*\)/,'')}</text>`}

function dest(q){const m=q.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),A=Object.values(L).filter(l=>l.t!=='corredor');
 const tam=r=>r.reduce((s,k,i)=>i?s+Math.hypot(L[k].x-L[r[i-1]].x,L[k].y-L[r[i-1]].y):0,0);
 const near=c=>{let b=null,bd=1e9;c.forEach(l=>{const r=rota(QR[o],l.id,acc);if(r&&tam(r)<bd){bd=tam(r);b=l}});return b};
 const nm=l=>l.n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const tp=(re,t)=>re.test(m)?A.filter(l=>l.t===t):[];
 const G=['praca','eventos','entrada','acesso','principal','estacionamento','subsolo','ala','terreo','loja','salao','alimentacao'];
 const tk=new Set(m.split(/\W+/)),par=A.filter(l=>nm(l).replace(/[^a-z0-9& ]/g,' ').split(/\s+/).some(w=>w.length>=3&&!G.includes(w)&&tk.has(w)));

function draw(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===tab));$('#note').textContent=NOTE[tab];$('#app').innerHTML=VIEW[tab]()}

const qrSel=()=>`<select id="qr" aria-label="QR lido" onchange="o=this.value;msgs=[];draw()" style="font:inherit;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--ink);max-width:100%">${Object.keys(QR).map(k=>`<option value="${k}" ${k===o?'selected':''}>${k} · ${L[QR[k]].n}</option>`).join('')}</select>`;

const HOME=()=>`<p style="margin:0 0 8px">QR lido: ${qrSel()}</p>${Q()}<h1 style="font-size:28px;margin-top:16px">Olá!<br>Como podemos ajudar hoje?</h1><div style="display:flex;gap:6px"><input id="q" placeholder="Digite sua dúvida…" aria-label="Busca" onkeydown="if(event.key==='Enter')go()"><button class="b p" onclick="go()">Buscar</button></div><div class="g2"><button class="b" onclick="tab='reg';pass=1;draw()"><span style="font-size:24px">🛠️</span>Reportar problema</button><button class="b" onclick="tab='reg';cat='Objeto perdido';pass=2;draw()"><span style="font-size:24px">🎒</span>Achados e perdidos</button><button class="b" onclick="tab='chat';ask('onde fica o estacionamento')"><span style="font-size:24px">🅿️</span>Estacionamento</button><button class="b" onclick="tab='chat';draw()"><span style="font-size:24px">🛍️</span>Lojas e serviços</button></div><p><a href="#" onclick="tab='prot';draw();return false" style="color:var(--ink)">Meus protocolos ›</a></p>`;

home:()=>phone(HOME()+SOSB),
sos:()=>phone(HOME()+SOSB+`<div class="modal" role="dialog" aria-label="SOS"><div><h3>Precisa de ajuda urgente?</h3><p style="color:var(--mu);margin:0 0 8px">Escolha o tipo de ocorrência:</p>${['Emergência médica','Criança perdida','Segurança'].map(t=>`<button class="b r" style="width:100%;margin:4px 0" onclick="tab='prot';draw()">${t}</button>`).join('')}<p style="font-size:14px">A equipe do shopping vai até o local deste QR Code.<br><b>Risco de vida? Ligue 192 ou 193.</b></p><button class="b" style="width:100%" onclick="tab='home';draw()">Cancelar</button></div></div>`),
chat:()=>phone(`<h2>Assistente</h2><p style="margin:0 0 6px">QR lido: ${qrSel()}</p>${Q()}<div>${msgs.length?'':'<div class="msg">Pergunte onde fica uma loja, o banheiro ou o estacionamento. Eu mostro o caminho na planta.</div>'}${msgs.map(m=>`<div class="msg ${m.me?'me':''}">${m.t}${m.p?`<div style="margin-top:8px">${plan(m.p,QR[o])}</div><div style="display:flex;gap:6px;margin-top:8px">${acc?'':`<button class="b" style="flex:1;font-size:13px" onclick="ask('${m.q.replace(/'/g,'')}',true)">♿ Rota acessível</button>`}<a class="b" style="flex:1;font-size:13px;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('Capim Dourado Shopping Palmas '+m.d.n)}">Abrir no Google Maps</a></div>`:''}${m.nf?'<div style="margin-top:6px"><b>Não resolveu? Abrir um chamado</b></div>':''}</div>`).join('')}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">${['Onde fica a Renner?','Quero comer','Banheiro','Outback'].map(t=>`<button class="b" style="min-height:36px;font-size:13px" onclick="ask('${t}')">${t}</button>`).join('')}</div><div style="display:flex;gap:6px;padding-bottom:70px"><input id="q" placeholder="Escreva sua mensagem…" aria-label="Mensagem" onkeydown="if(event.key==='Enter'&&this.value.trim()){ask(this.value)}"><button class="b p" onclick="$('#q').value.trim()&&ask($('#q').value)">Enviar</button></div>${SOSB}`),
reg:()=>phone(`<h2>Reportar problema</h2><p style="margin:0">${[1,2,3].map(i=>`<span class="chip ${pass>=i?'s':''}" style="${pass>=i?'background:var(--ink);color:var(--pa);border-color:var(--ink)':''};padding:3px 11px">${i}</span>`).join('')}</p>`+(pass===1?`<p><b>Qual é o problema?</b></p><div style="display:flex;flex-wrap:wrap;gap:8px">${['Limpeza','Manutenção','Segurança','Objeto perdido','Outro'].map(c=>`<button class="b ${cat===c?'p':''}" onclick="cat='${c}';draw()">${c}</button>`).join('')}</div><p><button class="b p" style="width:100%" onclick="if(cat){pass=2;draw()}">Continuar</button></p>`:pass===2?`<p><b>Descreva (opcional)</b></p><textarea rows="4" style="width:100%;font:inherit;border-radius:12px;border:1px solid var(--bd);padding:10px;background:var(--card);color:var(--ink)" placeholder="Ex.: banheiro sem papel"></textarea><p><b>Foto (opcional)</b><br><span style="color:var(--mu);font-size:14px">JPG ou PNG até 2 MB</span></p><p class="loc">📍 Local: ${L[QR[o]].n} (${o})</p><button class="b" onclick="pass=1;draw()">Voltar</button> <button class="b p" onclick="pass=3;draw()">Continuar</button>`:`<div class="msg" style="max-width:100%"><b>${cat}</b><br>Sem descrição<br><span style="color:var(--mu);font-size:14px">📍 ${L[QR[o]].n}</span></div><button class="b" onclick="pass=2;draw()">Voltar</button> <button class="b p" onclick="tab='prot';draw()">Enviar chamado</button>`)+SOSB),
prot:()=>phone(`<h2 style="text-align:center;margin-top:16px">✅ Chamado registrado</h2><div class="msg" style="max-width:100%;text-align:center"><b>Recebemos sua solicitação</b><div style="color:var(--mu);font-size:14px">Protocolo</div><div style="font:700 28px 'Bricolage Grotesque'">OC-2026-0147</div>Código de validação: <b>4821</b></div><div class="msg" style="max-width:100%">● <b>Recebido</b> <span style="float:right;color:var(--mu)">agora</span><br><span style="color:var(--mu)">○ Em atendimento<br>○ Resolvido</span></div><p style="color:var(--mu);font-size:14px;text-align:center">Guarde o protocolo e o código para acompanhar.</p><button class="b p" style="width:100%">Acompanhar chamado</button> <button class="b" style="width:100%;margin-top:8px" onclick="tab='home';draw()">Voltar ao início</button>${SOSB}`),
kan:()=>{const C=[['Novo',[['SOS #0149','12:07','Emergência médica · Praça de Alimentação (Salão Central)','Máxima','Brigada',1],['#0148','12:05','Limpeza · Banheiro Masculino (Praça de Alimentação)','Normal','Limpeza'],['#0146','11:58','Manutenção · Entrada Principal (Av. NS-05)','Normal','Manutenção']]],['Em atendimento',[['#0144','11:40','Segurança · Estacionamento Subsolo 1','Alta','Segurança'],['#0141','11:22','Objeto perdido · Cinemark','Normal','SAC']]],['Resolvido',[['#0139','10:51','Limpeza · Banheiros Térreo (Ala Oeste)','Normal','Limpeza'],['#0137','10:30','Manutenção · Elevador (Praça de Alimentação)','Alta','Manutenção']]]];
 return `<div class="pan"><h2>Chamados</h2><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">${['Setor','Categoria','Prioridade','Hoje'].map(f=>`<span class="b" style="min-height:38px">${f} ▾</span>`).join('')}</div><div class="kb">${C.map(([n,a])=>`<section class="col"><b>${n} (${a.length})</b>${a.map(c=>`<article class="tk ${c[5]?'s':''}"><div style="display:flex;justify-content:space-between"><b style="${c[5]?'color:var(--sos)':''}">${c[0]}</b><span style="color:var(--mu);font-size:13px">${c[1]}</span></div>${c[2]}<br><span class="chip ${c[5]?'s':''}">${c[3]}</span><span class="chip">${c[4]}</span></article>`).join('')}</section>`).join('')}</div><p style="color:var(--mu);font-size:14px">Cartões chegam em tempo real · arrastar muda o status.</p></div>`},
int:()=>{const H={'BANHEIRO-P-MASC':52,'PRACA-ALIM-CENTRO':34,'ESTAC-S1':23,'ACESSO-NS05':18,'COR-LESTE-CENTRO':9};
 const pat=[['Recorrência','Banheiro Masculino (Praça de Alimentação): 14 chamados de limpeza em 7 dias, 70% entre 12h e 14h.'],['Gargalo','Chamados de manutenção abertos depois das 18h levam 2,0× o tempo para serem resolvidos.'],['Reincidência','Elevador (Praça de Alimentação): 3 reaberturas depois de marcado como resolvido.'],['Desvio fora do normal','O ponto QR-047 teve 9 chamados hoje, contra média de 1 por dia.']];
 return `<div class="pan"><h2>Inteligência de dados</h2><div class="kp">${[['Chamados (7 dias)','212'],['1ª resposta','6 min'],['Resolução','38 min'],['Reabertura','4%']].map(k=>`<div>${k[0]}<b>${k[1]}</b></div>`).join('')}</div><div class="two"><div class="box"><b>Mapa de calor sobre a planta</b>${plan(null,null,H)}<small style="color:var(--mu)">Intensidade = nº de chamados por local</small></div><div class="box"><b>Padrões identificados</b>${pat.map(p=>`<div style="background:var(--gz);border-radius:12px;padding:10px;margin-top:10px"><b>${p[0]}</b><br>${p[1]}<details><summary style="font-size:13px;cursor:pointer">ver evidência</summary><span style="font-size:13px;color:var(--mu)">OC-2026-0101, OC-2026-0117, OC-2026-0123…</span></details></div>`).join('')}<p style="color:var(--mu);font-size:14px">O sistema apresenta; a decisão é do gestor.</p></div></div></div>`}};
$('#nav').innerHTML=TABS.map(([k,n])=>`<button data-k="${k}" onclick="tab='${k}';draw()">${n}</button>`).join('');
draw();
</script></body></html>
